name: keepalive

# GitHub disables scheduled workflows in public repos after 60 days without
# repository activity. Re-enabling through the API resets that timer without
# dummy commits.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in ingest.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/${wf}/enable"
            echo "enabled ${wf}"
          done
